<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate maker</title>
<!--
  Generates every graphic in the README into ../assets/.
  Run `python3 tools/serve.py`, open http://127.0.0.1:8765/tools/build.html, press Save.

  All type is converted to outlines here (fontkit for Bricolage Grotesque, MathJax for TeX),
  because GitHub shows README images with no fonts available: what you see on this page is
  exactly what renders on the profile.
-->
<style>
  :root { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; }
  body { margin: 0; background: #f6f8fa; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 12px 20px; background: #fff; border-bottom: 1px solid #d1d9e0; }
  button { font: inherit; padding: 5px 14px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
  #status { color: #59636e; }
  #status.bad { color: #d1242f; }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .row > div { padding: 20px 28px 28px; }
  .light { background: #fff; }
  .dark { background: #0d1117; color: #9198a1; }
  .name { font-size: 12px; margin: 0 0 8px; }
  img { display: block; width: 100%; height: auto; }
  @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <strong>Plate maker</strong>
  <button id="replay" disabled>Replay</button>
  <button id="save" disabled>Save to assets/</button>
  <span id="status" role="status">Loading type…</span>
</header>
<main id="out"></main>

<script>window.MathJax = { svg: { fontCache: 'local' }, startup: { typeset: false } };</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
import * as fontkit from 'https://cdn.jsdelivr.net/npm/fontkit@2.0.4/+esm';

// ─── Helpers ─────────────────────────────────────────────────────────────────

const $ = (s) => document.querySelector(s);
const say = (text, bad = false) => { $('#status').textContent = text; $('#status').classList.toggle('bad', bad); };
const r1 = (n) => Math.round(n * 10) / 10;
const short = (d) => d.replace(/-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/gi, (n) => String(r1(+n)));
const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

// Seeded PRNG (mulberry32): the same build always writes the same bytes.
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A print tint: `cover` of the ink laid on white paper.
function tint(hex, cover) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255]
    .map((c) => Math.round(255 - (255 - c) * cover).toString(16).padStart(2, '0')).join('');
}

// Rupees from integer paise, grouped the Indian way: 12,34,567.89.
function inr(paise) {
  const rupees = String(Math.floor(paise / 100)), p = String(paise % 100).padStart(2, '0');
  const head = rupees.slice(0, -3), tail = rupees.slice(-3);
  return (head ? head.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + tail + '.' + p;
}

function svgDoc(w, h, body, css, title) {
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
    + `<title>${esc(title)}</title>${css ? `<style>${css.trim().replace(/\n\s*/g, '')}</style>` : ''}${body}</svg>\n`;
}

// ─── Type → outlines ─────────────────────────────────────────────────────────

async function loadBytes(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return new Uint8Array(await res.arrayBuffer());
}

const createFont = (bytes) => (fontkit.create ?? fontkit.default.create)(bytes);

// fontkit decodes WOFF2 (Brotli plus the transformed glyf table) but can't apply variations to
// those outlines, and its getVariation() re-reads a WOFF2 as plain TTF. So: rebuild a plain
// TrueType file from what it decoded (glyf and loca re-encoded, every other table copied as is),
// and vary that. Hinting instructions are dropped; nothing here is rasterised at small sizes.
function toTrueType(woff2) {
  woff2.getGlyph(0); // makes fontkit decode the transformed glyf table
  const glyphs = woff2._transformedGlyphs, raw = woff2.stream.buffer, dir = woff2.directory.tables;
  const boxes = [];
  const box = (gid) => {
    if (boxes[gid]) return boxes[gid];
    const g = glyphs[gid];
    let b = [0, 0, 0, 0];
    if (g?.numberOfContours > 0) {
      b = [Infinity, Infinity, -Infinity, -Infinity];
      for (const p of g.points) b = [Math.min(b[0], p.x), Math.min(b[1], p.y), Math.max(b[2], p.x), Math.max(b[3], p.y)];
    } else if (g?.numberOfContours < 0) {
      b = [Infinity, Infinity, -Infinity, -Infinity];
      for (const c of g.components) {
        const [x0, y0, x1, y1] = box(c.glyphID);
        for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) {
          const tx = x * c.scaleX + y * c.scale01 + c.dx, ty = y * c.scaleY + x * c.scale10 + c.dy;
          b = [Math.min(b[0], tx), Math.min(b[1], ty), Math.max(b[2], tx), Math.max(b[3], ty)];
        }
      }
      if (!Number.isFinite(b[0])) b = [0, 0, 0, 0];
    }
    return (boxes[gid] = b.map(Math.round));
  };
  const f2dot14 = (v) => Math.round(v * 16384);
  const encode = (gid) => {
    const g = glyphs[gid];
    if (!g || g.numberOfContours === 0) return [];
    const w = [], i16 = (v) => w.push((v >> 8) & 255, v & 255);
    i16(g.numberOfContours);
    box(gid).forEach(i16);
    if (g.numberOfContours > 0) {
      g.points.forEach((p, i) => p.endContour && i16(i));
      i16(0); // no instructions
      for (const p of g.points) w.push(p.onCurve ? 1 : 0); // no short vectors: every delta is an int16
      let last = 0;
      for (const p of g.points) { i16(p.x - last); last = p.x; }
      last = 0;
      for (const p of g.points) { i16(p.y - last); last = p.y; }
    } else {
      g.components.forEach((c, i) => {
        const more = i < g.components.length - 1 ? 0x20 : 0;
        const matrix = c.scale01 || c.scale10 ? 0x80 : c.scaleX !== c.scaleY ? 0x40 : c.scaleX !== 1 ? 0x08 : 0;
        i16(0x0001 | 0x0002 | more | matrix); // args are words, args are x/y offsets
        i16(c.glyphID);
        i16(c.dx);
        i16(c.dy);
        if (matrix === 0x08) i16(f2dot14(c.scaleX));
        if (matrix === 0x40) { i16(f2dot14(c.scaleX)); i16(f2dot14(c.scaleY)); }
        if (matrix === 0x80) [c.scaleX, c.scale01, c.scale10, c.scaleY].forEach((v) => i16(f2dot14(v)));
      });
    }
    while (w.length % 4) w.push(0);
    return w;
  };

  const glyf = [], loca = new Uint8Array((glyphs.length + 1) * 4), locaView = new DataView(loca.buffer);
  glyphs.forEach((_, gid) => { locaView.setUint32(gid * 4, glyf.length); glyf.push(...encode(gid)); });
  locaView.setUint32(glyphs.length * 4, glyf.length);

  const tables = {};
  for (const [tag, t] of Object.entries(dir)) if (tag !== 'glyf' && tag !== 'loca') tables[tag] = raw.slice(t.offset, t.offset + t.length);
  tables.head = tables.head.slice();
  tables.head[50] = 0; tables.head[51] = 1; // indexToLocFormat: long offsets
  tables.glyf = new Uint8Array(glyf);
  tables.loca = loca;

  const tags = Object.keys(tables).sort(), n = tags.length, sel = Math.floor(Math.log2(n));
  let offset = 12 + 16 * n;
  const at = {};
  for (const tag of tags) { at[tag] = offset; offset += (tables[tag].length + 3) & ~3; }
  const out = new Uint8Array(offset), dv = new DataView(out.buffer);
  dv.setUint32(0, 0x00010000); dv.setUint16(4, n); dv.setUint16(6, 16 * 2 ** sel); dv.setUint16(8, sel); dv.setUint16(10, 16 * n - 16 * 2 ** sel);
  tags.forEach((tag, i) => {
    const data = tables[tag], rec = 12 + 16 * i;
    let sum = 0;
    for (let k = 0; k < data.length; k += 4) sum = (sum + (((data[k] << 24) | ((data[k + 1] ?? 0) << 16) | ((data[k + 2] ?? 0) << 8) | (data[k + 3] ?? 0)) >>> 0)) >>> 0;
    for (let k = 0; k < 4; k++) out[rec + k] = tag.charCodeAt(k);
    dv.setUint32(rec + 4, sum); dv.setUint32(rec + 8, at[tag]); dv.setUint32(rec + 12, data.length);
    out.set(data, at[tag]);
  });
  return out;
}

// One instance of the variable font per set of axes.
let brico, bricoWoff2;
const cuts = new Map();
function cut(axes) {
  const key = JSON.stringify(axes);
  if (!cuts.has(key)) cuts.set(key, brico.getVariation(axes));
  return cuts.get(key);
}

// One line of Bricolage Grotesque as a single path, baseline at y = 0.
function type(text, { size, wght = 400, opsz = 14, tracking = 0 }) {
  const font = cut({ wght, opsz, wdth: 100 });
  const run = font.layout(text);
  const s = size / font.unitsPerEm;
  let x = 0, d = '', top = 0;
  run.glyphs.forEach((g, i) => {
    const p = run.positions[i];
    d += g.path.scale(s, -s).translate(x + p.xOffset * s, -p.yOffset * s).toSVG();
    top = Math.max(top, (g.path.bbox.maxY + p.yOffset) * s);
    x += p.xAdvance * s + tracking;
  });
  return { d: short(d), width: x - tracking, top }; // top: ink height above the baseline
}

// TeX through MathJax, as paths, placed by baseline like `type`.
function tex(src, { size, color }) {
  const svg = MathJax.tex2svg(src, { display: false }).querySelector('svg');
  const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  const s = size / 1000; // MathJax draws in thousandths of an em
  const inner = svg.innerHTML.replaceAll('currentColor', color).replace(/\s(?:data-[\w-]+|aria-hidden)="[^"]*"/g, '');
  return {
    width: vw * s,
    at: (x, baseline) => `<svg x="${r1(x)}" y="${r1(baseline + vy * s)}" width="${r1(vw * s)}" height="${r1(vh * s)}" viewBox="${vx} ${vy} ${vw} ${vh}" overflow="visible">${inner}</svg>`,
  };
}

// ─── Print furniture ─────────────────────────────────────────────────────────

// Crop marks: short lines just outside each corner of the trim.
function cropMarks(x0, y0, x1, y1, color, len = 14, gap = 5) {
  let d = '';
  for (const [x, y, sx, sy] of [[x0, y0, -1, -1], [x1, y0, 1, -1], [x0, y1, -1, 1], [x1, y1, 1, 1]]) {
    d += `M${x + sx * gap} ${y}h${sx * len}M${x} ${y + sy * gap}v${sy * len}`;
  }
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1"/>`;
}

// A registration target. It prints on every plate, so it only looks solid when they agree.
function target(cx, cy, r, color, width = 1.2) {
  return `<g fill="none" stroke="${color}" stroke-width="${width}"><circle cx="${cx}" cy="${cy}" r="${r}"/>`
    + `<circle cx="${cx}" cy="${cy}" r="${r1(r * 0.42)}"/>`
    + `<path d="M${r1(cx - r * 1.55)} ${cy}H${r1(cx + r * 1.55)}M${cx} ${r1(cy - r * 1.55)}V${r1(cy + r * 1.55)}"/></g>`;
}

// ─── Themes ──────────────────────────────────────────────────────────────────
// Light is paper: subtractive process inks, and brain + silicon + genome overprint to black.
// Dark is a screen: additive light, and the same three add up to white.

const THEME = {
  light: {
    ink: '#1f2328', muted: '#59636e', faint: '#d1d9e0', blend: 'multiply', highlight: 0.55,
    plates: { brain: '#ec008c', silicon: '#00aeef', genome: '#fff200' },
    margin: '#e0147d', grid: '#00a3e0',
  },
  dark: {
    ink: '#f0f6fc', muted: '#9198a1', faint: '#3d444d', blend: 'screen', highlight: 0.5,
    plates: { brain: '#ff3355', silicon: '#3377ff', genome: '#33ff99' },
    margin: '#ff4fb8', grid: '#39c5f3',
  },
};
const SUBSTRATES = ['brain', 'silicon', 'genome'];

// ─── Hero: three plates slide into register ──────────────────────────────────

const NAME = 'Damaruk';

function hero(theme) {
  const k = THEME[theme], W = 1200, X = 64, GRID = 22, TOP = 54;
  // The name is set as large as the measure allows (never above 300), tracked in by 3%.
  const probe = type(NAME, { size: 100, wght: 800, opsz: 96, tracking: -3 });
  const size = Math.min(300, Math.floor(((W - 2 * X) / probe.width) * 100));
  const name = type(NAME, { size, wght: 800, opsz: 96, tracking: -size * 0.03 });
  const lines = [
    type('Editor and graphic designer, turned engineer.', { size: 34, wght: 600, opsz: 32 }),
    type('Now I build things that sense, remember and decide.', { size: 34, wght: 400, opsz: 32 }),
  ];
  for (const l of [name, ...lines]) if (X + l.width > W - X) throw new Error('hero: a line runs past the right margin');

  // Every baseline sits on a 22-unit grid; the name's goes on the first line that gives its
  // tallest letter room under the top margin, and everything else hangs from it.
  let base = TOP + GRID;
  while (base - name.top < TOP + 34) base += GRID;
  const line1 = base + 3 * GRID, line2 = base + 5 * GRID, labels = base + 8 * GRID;
  const H = labels + 70, cy = H / 2;
  const chip = { y: base + 6 * GRID, w: 152, h: 22, gap: 14 };
  const chips = [...SUBSTRATES, 'intelligence'];
  const chipX = (i) => X + i * (chip.w + chip.gap);
  const targets = [[600, 16], [600, H - 16], [16, cy], [W - 16, cy]];

  // One ink plate: everything that prints in that ink, moving together like a real sheet.
  // The intelligence chip is on all three plates: it only reads as one colour in register.
  const plate = (p) => `<g class="plate ${p}" fill="${k.plates[p]}">`
    + `<use href="#name" xlink:href="#name" x="${X}" y="${base}"/>`
    + `<rect x="${chipX(SUBSTRATES.indexOf(p))}" y="${chip.y}" width="${chip.w}" height="${chip.h}"/>`
    + `<rect x="${chipX(3)}" y="${chip.y}" width="${chip.w}" height="${chip.h}"/>`
    + targets.map(([x, y]) => target(x, y, 8, k.plates[p])).join('') + '</g>';

  // Non-printing guides, the way a layout looks before you hide them.
  let grid = '';
  for (let y = TOP + GRID; y <= labels; y += GRID) grid += `M${X} ${y}H${W - X}`;
  const guides = `<g class="guides" fill="none" stroke-width="1">`
    + `<path d="${grid}" stroke="${k.grid}" opacity=".22"/>`
    + `<rect x="${X}" y="${TOP}" width="${W - 2 * X}" height="${labels - TOP}" stroke="${k.margin}" opacity=".6"/></g>`;

  const css = `
    .plate{transform-box:view-box;transform-origin:600px ${cy}px;mix-blend-mode:${k.blend};animation:1.5s cubic-bezier(.16,1,.3,1) both}
    .brain{animation-name:brain;animation-delay:.15s}
    .silicon{animation-name:silicon;animation-delay:.3s}
    .genome{animation-name:genome;animation-delay:.45s}
    @keyframes brain{from{transform:translate(-34px,12px) rotate(-.8deg)}}
    @keyframes silicon{from{transform:translate(28px,-16px) rotate(.6deg)}}
    @keyframes genome{from{transform:translate(8px,24px) rotate(1deg)}}
    .label{animation:label .5s ease-out both}
    .l0{animation-delay:1.45s}.l1{animation-delay:1.6s}.l2{animation-delay:1.75s}.l3{animation-delay:2s}
    @keyframes label{from{opacity:0}}
    .guides{animation:guides .7s ease-in 1.9s both}
    @keyframes guides{to{opacity:0}}
    @media (prefers-reduced-motion:reduce){.plate,.label{animation:none}.guides{animation:none;opacity:0}}`;

  const body = `<defs><path id="name" d="${name.d}"/></defs>`
    + guides
    + `<g style="isolation:isolate">${SUBSTRATES.map(plate).join('')}</g>`
    + `<g fill="${k.ink}"><path transform="translate(${X} ${line1})" d="${lines[0].d}"/>`
    + `<path transform="translate(${X} ${line2})" d="${lines[1].d}"/></g>`
    + chips.map((c, i) => `<path class="label l${i}" fill="${k.muted}" transform="translate(${chipX(i)} ${labels})" d="${type(c, { size: 17, wght: 500, opsz: 12 }).d}"/>`).join('')
    + cropMarks(36, 32, W - 36, H - 32, k.muted);
  return svgDoc(W, H, body, css, NAME);
}

// ─── The long game: one equation, four kinds of matter ──────────────────────

function matter(theme) {
  const k = THEME[theme], W = 1200, H = 470, X = 64;
  const eq = tex('\\tau\\dot{x} = -x + u', { size: 104, color: k.ink });
  const caption = tex('\\textit{Relax toward the input, with memory }\\tau.', { size: 30, color: k.muted });
  const cols = [
    ['silicon', 'an RC filter'],
    ['brain', 'a neuron’s membrane'],
    ['genome', 'a gene’s expression'],
    ['intelligence', 'a recurrent unit'],
  ];
  const cw = 240, gap = (W - 2 * X - 4 * cw) / 3, top = 236;
  let body = eq.at(X, 132) + caption.at(X, 190);
  // A key for readers who don't read maths: the words from the manual's dictionary.
  const keyX = r1(X + eq.width + 64);
  [['x', 'what the system carries forward'], ['u', 'what pushes it'], ['\\tau', 'how long it remembers']].forEach(([sym, words], i) => {
    const y = 88 + i * 40, line = type(words, { size: 22, wght: 400, opsz: 24 });
    if (keyX + 36 + line.width > W - X) throw new Error(`matter: "${words}" runs past the right margin`);
    body += tex(sym, { size: 30, color: k.ink }).at(keyX, y)
      + `<path fill="${k.muted}" transform="translate(${r1(keyX + 36)} ${y})" d="${line.d}"/>`;
  });
  cols.forEach(([name, reading], i) => {
    const x = r1(X + i * (cw + gap));
    const inks = name === 'intelligence' ? SUBSTRATES : [name];
    body += `<g style="isolation:isolate">${inks.map((p) => `<rect x="${x}" y="${top}" width="${cw}" height="8" fill="${k.plates[p]}" style="mix-blend-mode:${k.blend}"/>`).join('')}</g>`
      + `<path fill="${k.ink}" transform="translate(${x} ${top + 50})" d="${type(name, { size: 38, wght: 700, opsz: 36 }).d}"/>`
      + `<path fill="${k.muted}" transform="translate(${x} ${top + 86})" d="${type(reading, { size: 24, wght: 400, opsz: 24 }).d}"/>`
      + relax(x, top + 112, cw, 96, k, name === 'intelligence' ? null : k.plates[name]);
  });
  return svgDoc(W, H, body, '', 'One equation, four kinds of matter');
}

// The step response x(t) = 1 − e^(−t/τ): the same curve in every column, dot at t = τ.
function relax(x0, y0, w, h, k, ink) {
  const lead = 16, pts = [];
  for (let i = 0; i <= 48; i++) {
    pts.push(`${r1(x0 + lead + ((w - lead) * i) / 48)} ${r1(y0 + h - (1 - Math.exp(-(i / 48) * 5)) * (h - 12))}`);
  }
  const d = 'M' + pts.join('L');
  const tx = r1(x0 + lead + (w - lead) / 5), ty = r1(y0 + h - (1 - Math.exp(-1)) * (h - 12));
  return `<path d="M${x0} ${y0 + h}H${r1(x0 + w)}" stroke="${k.faint}" stroke-width="1"/>`
    + `<path d="M${x0} ${y0 + h}H${x0 + lead}V${y0 + 12}H${r1(x0 + w)}" fill="none" stroke="${k.muted}" stroke-width="1.2" stroke-dasharray="3 4"/>`
    + (ink ? `<path d="${d}" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${k.highlight}" style="mix-blend-mode:${k.blend}"/>` : '')
    + `<path d="${d}" fill="none" stroke="${k.ink}" stroke-width="${ink ? 2 : 2.6}" stroke-linejoin="round"/>`
    + `<path d="M${tx} ${ty}V${y0 + h}" stroke="${k.muted}" stroke-width="1" stroke-dasharray="1 3"/>`
    + `<circle cx="${tx}" cy="${ty}" r="3.2" fill="${k.ink}"/>`;
}

// ─── Proofs: each project's own world, trimmed, with its inks as a colour bar ─

function proof({ title, bg, inks, draw }) {
  const W = 1200, H = 300, card = { x: 28, y: 20, w: 1144, h: 228 };
  const gray = '#8b949e'; // reads on GitHub's light and dark pages alike
  let bar = '', x = card.x;
  for (const ink of inks) {
    for (const cover of [1, 0.6, 0.3]) {
      bar += `<rect x="${x}" y="266" width="22" height="12" fill="${tint(ink, cover)}"/>`;
      x += 24;
    }
    x += 10;
  }
  const body = cropMarks(card.x, card.y, card.x + card.w, card.y + card.h, gray)
    + `<clipPath id="trim"><rect width="${card.w}" height="${card.h}"/></clipPath>`
    + `<g transform="translate(${card.x} ${card.y})" clip-path="url(#trim)"><rect width="${card.w}" height="${card.h}" fill="${bg}"/>${draw(card.w, card.h)}</g>`
    + bar + target(card.x + card.w - 9, 272, 7, gray, 1);
  return svgDoc(W, H, body, '', title);
}

// campus-guard: nobody is accused by a single frame.
const CAMPUS = {
  title: 'campus-guard',
  bg: '#06080a',
  inks: ['#06080a', '#fb8b1e', '#4af6c3', '#4c90f0', '#ff433d'],
  draw(W, H) {
    const c = { p1: '#111418', p2: '#1c2127', p3: '#252a31', p4: '#2f343c', t1: '#f6f7f9', t3: '#8f99a8', t4: '#5f6b7c',
                amber: '#fb8b1e', mint: '#4af6c3', ice: '#4c90f0' };
    const n = 12, fw = 58, fh = 76, gap = 10, x0 = 36, y0 = 30, stripW = n * (fw + gap) - gap;
    // One person walking past the rover, frame by frame. Two frames fail the quality gate,
    // and in one the tracker fuses two people under one ID.
    const kinds = ['ok', 'ok', 'blur', 'ok', 'ok', 'ok', 'blur', 'ok', 'swap', 'ok', 'ok', 'ok'];
    const best = [0.83, 0.87, 0.36, 0.9, 0.86, 0.91, 0.32, 0.89, 0.5, 0.92, 0.9, 0.93];
    const next = [0.41, 0.38, 0, 0.42, 0.37, 0.4, 0, 0.39, 0, 0.36, 0.4, 0.38];
    let s = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="${c.p4}" stroke-width="2"/></pattern></defs>`
      + `<rect x="${x0 - 14}" y="${y0 - 20}" width="${stripW + 28}" height="${fh + 40}" fill="${c.p1}"/>`;
    for (let x = x0 - 6; x < x0 + stripW + 6; x += 17) {
      s += `<rect x="${x}" y="${y0 - 14}" width="8" height="7" rx="1.5" fill="#06080a"/><rect x="${x}" y="${y0 + fh + 7}" width="8" height="7" rx="1.5" fill="#06080a"/>`;
    }
    const person = (px, col) => `<circle cx="${r1(px)}" cy="${y0 + 30}" r="8" fill="none" stroke="${col}" stroke-width="1.5"/>`
      + `<path d="M${r1(px - 17)} ${y0 + fh}c0-14 7-22 17-22s17 8 17 22" fill="none" stroke="${col}" stroke-width="1.5"/>`;
    const cx = (i) => x0 + i * (fw + gap) + fw / 2;
    kinds.forEach((kind, i) => {
      const fx = x0 + i * (fw + gap), px = cx(i) + Math.sin(i * 0.8) * 3, hy = y0 + 30;
      s += `<rect x="${fx}" y="${y0}" width="${fw}" height="${fh}" fill="#06080a" stroke="${c.p4}"/>`;
      if (kind === 'swap') {
        s += person(px - 8, c.t4) + person(px + 9, c.t4)
          + `<rect x="${r1(px - 23)}" y="${hy - 14}" width="46" height="28" fill="none" stroke="${c.amber}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      } else if (kind === 'blur') {
        s += person(px, c.p4) + `<rect x="${fx}" y="${y0}" width="${fw}" height="${fh}" fill="url(#hatch)"/>`;
      } else {
        s += person(px, c.t4) + `<rect x="${r1(px - 13)}" y="${hy - 13}" width="26" height="26" fill="none" stroke="${c.ice}" stroke-width="1.5"/>`;
      }
    });
    // Similarity per frame: the best match (blue) must clear the threshold (amber) AND beat the
    // runner-up (grey) by a margin. Rejected frames are hollow and don't vote.
    const cy0 = 150, cy1 = 206, y = (v) => r1(cy1 - ((v - 0.2) / 0.8) * (cy1 - cy0));
    const okIdx = kinds.map((k, i) => (k === 'ok' ? i : -1)).filter((i) => i >= 0);
    const top = okIdx.map((i) => `${cx(i)} ${y(best[i])}`), low = okIdx.map((i) => `${cx(i)} ${y(next[i])}`);
    s += `<path d="M${x0} ${cy1}H${x0 + stripW}" stroke="${c.p3}"/>`
      + `<path d="M${top.join('L')}L${low.reverse().join('L')}Z" fill="${c.ice}" opacity=".12"/>`
      + `<path d="M${x0} ${y(0.62)}H${x0 + stripW}" stroke="${c.amber}" stroke-width="1.2" stroke-dasharray="5 4"/>`
      + `<path d="M${okIdx.map((i) => `${cx(i)} ${y(next[i])}`).join('L')}" fill="none" stroke="${c.t4}" stroke-width="1.3"/>`
      + `<path d="M${top.join('L')}" fill="none" stroke="${c.ice}" stroke-width="1.8"/>`;
    kinds.forEach((kind, i) => {
      s += kind === 'ok'
        ? `<circle cx="${cx(i)}" cy="${y(best[i])}" r="3.2" fill="${c.ice}"/>`
        : `<circle cx="${cx(i)}" cy="${y(best[i])}" r="3.2" fill="#06080a" stroke="${kind === 'swap' ? c.amber : c.t4}" stroke-width="1.3"/>`;
    });
    // Evidence gathered into one decision, then the card: its QR is HMAC-signed in the real thing.
    const dx = 906, dy = y0 + fh / 2;
    s += `<path d="M${x0 + stripW + 16} ${dy}H${dx + 22}" stroke="${c.t4}" stroke-width="1.2" stroke-dasharray="2 4"/>`
      + `<circle cx="${dx + 50}" cy="${dy}" r="27" fill="none" stroke="${c.mint}" stroke-width="2"/>`
      + `<circle cx="${dx + 50}" cy="${dy}" r="6.5" fill="${c.mint}"/>`;
    const card = { x: 1010, y: 24, w: 112, h: 150 };
    s += `<rect x="${card.x}" y="${card.y}" width="${card.w}" height="${card.h}" rx="7" fill="${c.p2}" stroke="${c.p4}"/>`
      + `<rect x="${card.x + 14}" y="${card.y + 14}" width="38" height="46" rx="2" fill="${c.p3}"/>`
      + `<circle cx="${card.x + 33}" cy="${card.y + 31}" r="7" fill="none" stroke="${c.t4}" stroke-width="1.4"/>`
      + `<path d="M${card.x + 20} ${card.y + 60}c0-9 5-14 13-14s13 5 13 14" fill="none" stroke="${c.t4}" stroke-width="1.4"/>`
      + `<rect x="${card.x + 60}" y="${card.y + 20}" width="38" height="5" rx="2.5" fill="${c.p4}"/>`
      + `<rect x="${card.x + 60}" y="${card.y + 32}" width="28" height="5" rx="2.5" fill="${c.p4}"/>`
      + qr('https://vishvakrit.vercel.app/projects/rudram/', card.x + 14, card.y + 70, 70, c.t1);
    return s;
  },
};

// A real QR code (it opens the OVERWATCH simulator), drawn as one path.
function qr(text, x, y, size, fill) {
  const code = qrcode(0, 'M');
  code.addData(text);
  code.make();
  const n = code.getModuleCount(), m = size / n;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (code.isDark(r, c)) d += `M${r1(x + c * m)} ${r1(y + r * m)}h${r1(m + 0.05)}v${r1(m + 0.05)}h${-r1(m + 0.05)}z`;
  }
  return `<path d="${d}" fill="${fill}"/>`;
}

// VISHVAKRIT: the logo is a Chladni figure, so the proof is sand on vibrating plates.
const chladni = (m, n) => (x, y) =>
  Math.cos(m * Math.PI * x) * Math.cos(n * Math.PI * y) - Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y);

// Zero contour of f over the unit square (marching squares), scaled into a size×size box.
function contour(f, N, ox, oy, size) {
  const v = [];
  for (let j = 0; j <= N; j++) { v.push([]); for (let i = 0; i <= N; i++) v[j].push(f(i / N, j / N) + 1e-9); }
  const cross = (i, j, i2, j2) => {
    const a = v[j][i], b = v[j2][i2], t = a / (a - b);
    return `${r1(ox + ((i + (i2 - i) * t) / N) * size)} ${r1(oy + ((j + (j2 - j) * t) / N) * size)}`;
  };
  let d = '';
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const pts = [];
    if ((v[j][i] > 0) !== (v[j][i + 1] > 0)) pts.push(cross(i, j, i + 1, j));
    if ((v[j][i + 1] > 0) !== (v[j + 1][i + 1] > 0)) pts.push(cross(i + 1, j, i + 1, j + 1));
    if ((v[j + 1][i + 1] > 0) !== (v[j + 1][i] > 0)) pts.push(cross(i + 1, j + 1, i, j + 1));
    if ((v[j + 1][i] > 0) !== (v[j][i] > 0)) pts.push(cross(i, j + 1, i, j));
    for (let p = 0; p + 1 < pts.length; p += 2) d += `M${pts[p]}L${pts[p + 1]}`;
  }
  return d;
}

// Numbers as cells: digits are blocks, separators are ticks. Readable as money, private as data.
function digits(str, x, mid, fill, align = 'left', h = 10) {
  const cw = h * 0.62, gap = h * 0.24;
  const cells = [...str].map((ch) =>
    /\d/.test(ch) ? { w: cw, d: (x0) => `M${r1(x0)} ${r1(mid - h / 2)}h${r1(cw)}v${h}h${-r1(cw)}z` }
    : ch === ',' ? { w: 2, d: (x0) => `M${r1(x0)} ${r1(mid + h / 2 - 1.5)}h2v4h-2z` }
    : ch === '.' ? { w: 2, d: (x0) => `M${r1(x0)} ${r1(mid + h / 2 - 2)}h2v2h-2z` }
    : { w: 3, d: (x0) => `M${r1(x0)} ${r1(mid - 0.6)}h3v1.2h-3z` });
  const width = cells.reduce((a, g) => a + g.w + gap, -gap);
  let cx = align === 'right' ? x - width : x, d = '';
  for (const g of cells) { d += g.d(cx); cx += g.w + gap; }
  return `<path d="${d}" fill="${fill}"/>`;
}

    });
    // The ticket she gets: boarding-pass shape with notches, a photo as the fee, a barcode.
    const t = { x0: 40, y0: 38, x1: 470, y1: 190, r: 12, nx: 372 };
    const ticket = `M${t.x0 + t.r} ${t.y0}H${t.nx - 10}A10 10 0 0 0 ${t.nx + 10} ${t.y0}H${t.x1 - t.r}Q${t.x1} ${t.y0} ${t.x1} ${t.y0 + t.r}`
      + `V${t.y1 - t.r}Q${t.x1} ${t.y1} ${t.x1 - t.r} ${t.y1}H${t.nx + 10}A10 10 0 0 0 ${t.nx - 10} ${t.y1}H${t.x0 + t.r}`
      + `Q${t.x0} ${t.y1} ${t.x0} ${t.y1 - t.r}V${t.y0 + t.r}Q${t.x0} ${t.y0} ${t.x0 + t.r} ${t.y0}Z`;
    s += `<path d="${ticket}" transform="translate(5 5)" fill="${c.ink}"/><path d="${ticket}" fill="${c.milk}" stroke="${c.ink}" stroke-width="2"/>`
      + `<path d="M${t.nx} ${t.y0 + 14}V${t.y1 - 14}" stroke="${c.ink}" stroke-width="1.6" stroke-dasharray="3 5"/>`
      + cells.map(([x, y, col]) => `<rect x="${62 + x * 4}" y="${58 + y * 4}" width="4" height="4" fill="${col === c.milk ? c.blush : col}"/>`).join('')
      + `<rect x="62" y="112" width="150" height="10" rx="5" fill="${c.blush}"/><rect x="62" y="132" width="112" height="10" rx="5" fill="${c.blush}"/>`
      + `<rect x="62" y="152" width="170" height="10" rx="5" fill="${c.sky}"/>`
      + `<g transform="rotate(-6 296 112)"><rect x="250" y="58" width="92" height="106" fill="${c.milk}" stroke="${c.ink}" stroke-width="1.6"/>`
      + `<rect x="258" y="66" width="76" height="70" fill="${c.sky}"/><circle cx="296" cy="92" r="11" fill="${c.milk}"/>`
      + `<path d="M274 136c0-16 10-24 22-24s22 8 22 24" fill="${c.milk}"/></g>`
      + `<rect x="252" y="128" width="58" height="22" rx="4" fill="none" stroke="${c.rose}" stroke-width="2" transform="rotate(-14 281 139)"/>`;
    let bars = '', bx = 392;
    while (bx < 452) { const w = [1.5, 2.5, 4][Math.floor(rand() * 3)]; bars += `M${r1(bx)} 64h${w}v${t.y1 - t.y0 - 52}h-${w}z`; bx += w + 2 + rand() * 2.5; }
    s += `<path d="${bars}" fill="${c.ink}"/>`;
    // Sparkles.
    const star = (x, y, r, col) => `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${col}"/>`;
    s += star(560, 52, 9, c.corn) + star(1070, 196, 8, c.bubble) + star(812, 190, 6, c.blush) + star(1086, 36, 7, c.corn) + star(640, 186, 5, c.bubble);
    return s;
  },
};

function endMark() {
  return svgDoc(48, 48, target(24, 24, 11, '#8b949e', 1.2), '', 'end');
}

// ─── Build, check, preview, save ─────────────────────────────────────────────

const PROOFS = { 'proof-campus-guard': CAMPUS, 'proof-vishvakrit': VISHVAKRIT, 'proof-ledger-one': LEDGER, 'proof-daari': DAARI, 'proof-rebeka': REBEKA, 'proof-gift': GIFT };

function build() {
  const files = { 'hero-light': hero('light'), 'hero-dark': hero('dark'), 'matter-light': matter('light'), 'matter-dark': matter('dark') };
  for (const [name, spec] of Object.entries(PROOFS)) files[name] = proof(spec);
  files.end = endMark();
  return files;
}

// The runnable check: the logic that can silently go wrong, and the output GitHub will choke on.
function check(files) {
  const problems = [];
  const cases = [[123456789, '12,34,567.89'], [5, '0.05'], [100000, '1,000.00'], [100000000, '10,00,000.00']];
  for (const [paise, want] of cases) if (inr(paise) !== want) problems.push(`inr(${paise}) = ${inr(paise)}, want ${want}`);
  if (short('M1.25 -0.04L2e-7 3.96') !== 'M1.3 0L0 4') problems.push(`short() = ${short('M1.25 -0.04L2e-7 3.96')}`);
  if (tint('#000000', 0.3) !== '#b3b3b3') problems.push(`tint = ${tint('#000000', 0.3)}`);
  // The rebuilt TrueType must draw exactly what the WOFF2 draws at the default instance,
  // for a simple glyph, a composite (é) and the apostrophe.
  for (const ch of 'dké’2') {
    const cp = ch.codePointAt(0);
    const a = brico.glyphForCodePoint(cp).path.toSVG(), b = bricoWoff2.glyphForCodePoint(cp).path.toSVG();
    if (a !== b || !a) problems.push(`rebuilt font differs on "${ch}"`);
  }
  // And a variation must actually change the outline.
  if (cut({ wght: 400, opsz: 32, wdth: 100 }).glyphForCodePoint(100).path.toSVG() === brico.glyphForCodePoint(100).path.toSVG()) problems.push('variation had no effect');
  for (const [name, svg] of Object.entries(files)) {
    if (new DOMParser().parseFromString(svg, 'image/svg+xml').querySelector('parsererror')) problems.push(`${name}: not well-formed`);
    if (/NaN|undefined|Infinity/.test(svg)) problems.push(`${name}: NaN/undefined in output`);
    if (/(?:href|src)="(?:https?:)?\/\//.test(svg)) problems.push(`${name}: external reference`);
    const ids = [...svg.matchAll(/\sid="([^"]+)"/g)].map((m) => m[1]);
    if (new Set(ids).size !== ids.length) problems.push(`${name}: duplicate ids`);
  }
  return problems;
}

const toUrl = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
function render(files) {
  const pairs = [['hero-light', 'hero-dark'], ['matter-light', 'matter-dark'], ...Object.keys(PROOFS).map((p) => [p, p]), ['end', 'end']];
  $('#out').innerHTML = pairs.map(([a, b]) => `<section class="row">`
    + `<div class="light"><p class="name">${a}.svg · ${(files[a].length / 1024).toFixed(1)} KB</p><img alt="" src="${toUrl(files[a])}"></div>`
    + `<div class="dark"><p class="name">${b}.svg</p><img alt="" src="${toUrl(files[b])}"></div></section>`).join('');
}

try {
  await MathJax.startup.promise;
  bricoWoff2 = createFont(await loadBytes('fonts/bricolage-grotesque.woff2'));
  brico = createFont(toTrueType(bricoWoff2));
  const files = build();
  const problems = check(files);
  render(files);
  const kb = Object.values(files).reduce((a, s) => a + s.length, 0) / 1024;
  say(problems.length ? `Problems: ${problems.join('; ')}` : `${Object.keys(files).length} plates, all well-formed, ${kb.toFixed(0)} KB in total.`, problems.length > 0);
  window.__plates = files;
  window.__problems = problems;
  $('#replay').disabled = false;
  $('#replay').onclick = () => render(files);
  $('#save').disabled = problems.length > 0;
  $('#save').onclick = async () => {
    say('Saving…');
    for (const [name, svg] of Object.entries(files)) {
      const res = await fetch(`/save/${name}.svg`, { method: 'POST', headers: { 'Content-Type': 'image/svg+xml' }, body: svg });
      if (!res.ok) return say(`Save failed on ${name}.svg: HTTP ${res.status}`, true);
    }
    say(`Saved ${Object.keys(files).length} plates to assets/.`);
    window.__saved = true;
  };
} catch (err) {
  say(`Build failed: ${err.message}`, true);
  window.__problems = [String(err.stack || err)];
  throw err;
}
</script>
</body>
